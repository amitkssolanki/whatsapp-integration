# Recurring jobs run by the Solid Queue scheduler (inside Puma via SOLID_QUEUE_IN_PUMA).
production: &recurring
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Self-healing: re-enqueues lost webhook and send jobs, fails (and retries up to
  # 3 times) deliveries stuck in `processing`, and moves sends stuck in `sending`
  # to unknown (see StallSweeperJob).
  stall_sweeper:
    class: StallSweeperJob
    schedule: every 5 minutes

  # Read-only catalog drift check against Meta (see CatalogReconcileJob and
  # docs/v2/CATALOG.md). It records a report and never corrects anything. The
  # scheduled run does nothing unless CATALOG_SYNC_ENABLED=true, so merging it
  # into development below is harmless; to run it by hand in development use
  #   bin/rails runner 'CatalogReconcileJob.perform_now(by: "console")'
  catalog_reconcile:
    class: CatalogReconcileJob
    schedule: every day at 3am

development:
  <<: *recurring
