# Recurring jobs run by the Solid Queue scheduler (inside Puma via SOLID_QUEUE_IN_PUMA).
production: &recurring
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Moves deliveries stuck in `processing` to failed and sends stuck in
  # `sending` to unknown (see StallSweeperJob).
  stall_sweeper:
    class: StallSweeperJob
    schedule: every 5 minutes

development:
  <<: *recurring
